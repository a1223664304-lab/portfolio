<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="星绘设计工作室，专注3D产品渲染、场景视觉、AI创意设计与动态视觉。"
    />
    <title>星绘设计工作室｜设计合作伙伴</title>
    <link rel="icon" href="./assets/logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body id="top" data-page="home">
    <div class="page-shell">
      <header class="site-header" aria-label="页面顶部">
        <div class="container header-inner">
          <a class="brand" href="#top" aria-label="星绘设计工作室首页">
            <img
              class="brand-image"
              src="./assets/logo.png"
              alt="星绘设计工作室"
            />
          </a>

          <nav class="site-nav" aria-label="主导航" id="siteNav"></nav>

          <button class="header-cta" type="button" data-open-contact="true">联系我们</button>
        </div>
      </header>

      <main>
        <section class="hero container" aria-labelledby="heroTitle">
          <h1 id="heroTitle">星绘设计工作室</h1>
          <p>设计合作伙伴</p>
        </section>

        <section class="portfolio container" id="works" aria-labelledby="worksTitle">
          <div class="sr-only" id="worksTitle">作品分类</div>
          <div id="workGroups" class="work-groups"></div>
          <div class="more-link">
            <a id="moreCasesLink" href="./cases.html">更多案例</a>
          </div>
        </section>

        <section class="content-section container" id="services" aria-labelledby="servicesTitle">
          <p class="section-label">服务介绍</p>
          <div class="section-main">
            <h2 id="servicesTitle">
              为公司提供高质量的3D产品渲染与视觉设计服务，助力品牌展示、产品推广与商业增长。
            </h2>
            <div class="service-grid" id="serviceGrid"></div>
          </div>
        </section>

        <section class="content-section container about-section" id="about" aria-labelledby="aboutTitle">
          <p class="section-label">关于我们</p>
          <div class="section-main">
            <h2 id="aboutTitle">
              我们是一家专注于3D视觉设计的小型工作室，服务于小米、华为、vivo 等科技品牌，提供产品渲染、场景视觉与 AI 创意设计服务。
            </h2>
            <div class="about-gallery" id="aboutGallery" aria-label="工作室占位图片"></div>
          </div>
        </section>

        <section class="content-section contact-section container" id="contact" aria-labelledby="contactTitle">
          <p class="section-label">联系方式</p>
          <div class="section-main contact-main">
            <h2 id="contactTitle">我们来讨论一下<br />你的项目吧！</h2>
            <div class="contact-actions" id="contactActions"></div>
            <dl class="contact-info" id="contactInfo"></dl>
          </div>
        </section>
      </main>

      <footer class="site-footer container">
        <a class="back-to-top" href="#top" aria-label="回到首页">
          <span aria-hidden="true">↑</span>
          <span>回到首页</span>
        </a>
      </footer>
    </div>

    <div class="preview-modal" id="previewModal" hidden>
      <button class="preview-backdrop" type="button" data-close-preview="true" aria-label="关闭预览"></button>
      <div class="preview-panel" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <button class="preview-close" type="button" data-close-preview="true" aria-label="关闭预览">×</button>
        <div class="preview-media">
          <img id="previewImage" alt="" />
        </div>
        <div class="preview-caption">
          <h3 id="previewTitle"></h3>
          <p id="previewMeta"></p>
        </div>
      </div>
    </div>

    <div class="contact-modal" id="contactModal" hidden>
      <button class="contact-backdrop" type="button" data-close-contact="true" aria-label="关闭二维码"></button>
      <div class="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contactQrTitle">
        <button class="contact-close" type="button" data-close-contact="true" aria-label="关闭二维码">×</button>
        <div class="contact-qr">
          <img id="contactQrImage" alt="" />
        </div>
        <div class="contact-copy">
          <h3 id="contactQrTitle"></h3>
          <p id="contactQrMeta"></p>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
